    <style>
        /* =========================================================
           ILLIG KI-Plattform – B2C Custom UI (SignUpSignIn)
           Farbwelt aus app.css der Blazor-App übernommen.
           ========================================================= */
        :root {
            --ill-bg: #050b16;
            --ill-panel: #101a31;
            --ill-elevated: #0d1527;
            --ill-border: rgba(136, 157, 194, 0.16);
            --ill-border-strong: rgba(136, 157, 194, 0.28);
            --ill-text: #f5f8ff;
            --ill-soft: #c5d1e8;
            --ill-muted: #91a3c4;
            --ill-accent: #2f67ff;
            --ill-accent-strong: #5b8fff;
            --ill-link: #8db4ff;
            --ill-error: #ff7d7d;
            --ill-radius: 0.6rem;
        }

        html {
            background: 0 0;
            height: 100%;
        }

        body {
            font-family: Bahnschrift, "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-attachment: fixed;
            background-color: var(--ill-bg);
            background-image:
                radial-gradient(circle at top, rgba(37, 74, 158, 0.28), transparent 38%),
                linear-gradient(180deg, #07101f 0%, #050b16 100%);
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            color: var(--ill-text);
            text-align: left;
        }

        /* Maschinen-Freisteller (transparentes PNG): rechts verankert,
           unbeschnitten (object-fit:contain) statt formatfüllend über
           die ganze Fläche gecovert – sonst würde "cover" den Freisteller
           hochskalieren und an den Rändern beschneiden. Drop-Shadow +
           Reflexion geben ihm Bodenhaftung, statt frei zu schweben. */
        .hero-bg {
            position: fixed;
            right: 1%;
            top: 50%;
            left: auto;
            bottom: auto;
            transform: translateY(-50%);
            width: min(50vw, 820px);
            height: auto;
            object-fit: contain;
            z-index: 0;
            filter: drop-shadow(0 26px 46px rgba(2, 6, 14, .55)) drop-shadow(0 0 60px rgba(47, 103, 255, .2));
            -webkit-box-reflect: below 2px linear-gradient(transparent, transparent 55%, rgba(255, 255, 255, .22));
        }

        /* Weicher Bodenglow hinter der Maschine, damit sie in der Szene
           verankert wirkt statt auf schwarzem Grund zu schweben. */
        .hero-glow {
            position: fixed;
            right: 4%;
            top: 50%;
            transform: translateY(-50%);
            width: 42vw;
            height: 42vw;
            max-width: 540px;
            max-height: 540px;
            background: radial-gradient(circle, rgba(91, 143, 255, .32), transparent 70%);
            filter: blur(70px);
            z-index: 0;
            pointer-events: none
        }

        /* Navy-Verlauf: dunkelt die linke Seite (Karte) ab, blendet aber
           nach rechts hin aus, damit der Freisteller seine eigenen Farben
           behält statt vom Overlay grau überlagert zu werden. */
        .hero-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            background:
                radial-gradient(circle at top, rgba(37, 74, 158, 0.12), transparent 45%),
                linear-gradient(180deg, rgba(5, 11, 22, 0.18) 0%, rgba(5, 11, 22, 0.30) 100%),
                linear-gradient(90deg, rgba(5, 11, 22, .30) 0%, rgba(5, 11, 22, .30) 40%, transparent 68%)
        }

        .container {
            position: relative;
            z-index: 2
        }

        p {
            margin: 0
        }

        a {
            color: var(--ill-link);
        }

        a:hover {
            color: #dce9ff;
        }

        a:focus {

        input,
